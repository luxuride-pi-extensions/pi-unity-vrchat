name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps is not optional here. package.json declares
      # peerDependencies: { "pi-manager-core": "*" }, which is the documented
      # shape for a Pi package (docs/packages.md): it is loaded from the
      # extensions directory, not installed from the registry. Plain `npm ci`
      # therefore fails with 404 on a package that was never published, before a
      # single test runs.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test

  manager-core:
    name: manager-core consistency
    # pi-manager-core, pi-blender and pi-unity-blender are separate PRIVATE
    # repositories, so this job needs a PAT with read access to the org:
    # GITHUB_TOKEN cannot read a private repository even in the same org.
    #
    # Gated on a repository VARIABLE rather than `secrets`: `secrets` is not in
    # scope for a job-level `if` (only github/needs/vars/inputs are), and
    # `if: ${{ secrets.CONSUMER_TOKEN != '' }}` fails the WHOLE workflow file --
    # zero jobs, which is what the first run of this workflow reported. A
    # variable also expresses the real condition -- "this repo can read its
    # siblings" -- which is a property of the configuration, not of whether a
    # particular PAT happens to be populated today.
    if: ${{ vars.CONSUMER_REPOS_ENABLED == '1' }}
    needs: unit
    runs-on: ubuntu-latest
    steps:
      # pi-manager-core first, so this repo lands in a subdirectory and the
      # sibling checkouts can go beside it -- which is the layout
      # resolver-copies and allowlists look for, the same one the four repos
      # have in a working directory.
      - uses: actions/checkout@v4
        with:
          repository: luxuride-pi-extensions/pi-manager-core
          ref: master
          path: projects/pi-manager-core
          # github.token cannot read a PRIVATE repository.
          token: ${{ secrets.CONSUMER_TOKEN }}

      # The two extensions this repo's own tests compose their prompts from.
      # agent-templates.mjs resolves a template's tools by loading every
      # extension named in it, out of the INSTALLED extensions dir, and
      # engagement-test.mjs asserts two managers stay silent until engaged --
      # both against extensions that have to exist. On a runner none do.
      - uses: actions/checkout@v4
        with:
          repository: luxuride-pi-extensions/pi-blender
          ref: master
          path: projects/pi-blender
          token: ${{ secrets.CONSUMER_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: luxuride-pi-extensions/pi-unity-blender
          ref: master
          path: projects/pi-unity-blender
          token: ${{ secrets.CONSUMER_TOKEN }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install the manager core
        working-directory: projects/pi-manager-core
        run: npm ci

      - name: install the sibling extensions
        run: |
          for repo in pi-blender pi-unity-blender; do
            (cd "projects/$repo" && npm ci --legacy-peer-deps)
          done

      # Names pi installs under, which are not the repo names: the binder
      # extension is "unity-blender", and pi's own resolver probes both
      # "manager-core" and "pi-manager-core" when a consumer looks for it.
      - name: link the extensions into an agent dir
        run: |
          agent="$RUNNER_TEMP/agent-dir/extensions"
          mkdir -p "$agent"
          ln -s "$GITHUB_WORKSPACE/projects/pi-unity"         "$agent/pi-unity"
          ln -s "$GITHUB_WORKSPACE/projects/pi-blender"       "$agent/pi-blender"
          ln -s "$GITHUB_WORKSPACE/projects/pi-unity-blender" "$agent/unity-blender"
          ln -s "$GITHUB_WORKSPACE/projects/pi-manager-core" "$agent/manager-core"

      - name: install and test
        env:
          PI_AGENT_DIR: ${{ runner.temp }}/agent-dir
          PI_INSTALL_DIR: ${{ runner.temp }}/agent-dir/install
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm test

      # The core's own cross-repo checks, run against the sibling checkouts
      # above: resolver-copies diffs this repo's manager-core.ts and
      # agent-template-checks.mjs against the canonical files, allowlists
      # asserts every tool this manager's prompt names is in the index.ts
      # allowlist, and dependency-declaration asserts the peer range.
      #
      # pi-manager-core's own CI runs these same checks against all three
      # consumers. Running them here as well means a change here fails a check
      # in the PR that made it, rather than only in the core's next run.
      #
      # extension-registration.mjs is NOT in that list, and deliberately so:
      # this repo's manager has no slash command, so the check's engage/exit
      # assertions have nothing to assert against here. pi-manager-core's own
      # matrix job runs it for all three consumers, where it belongs.
      - name: cross-repo consistency checks
        working-directory: projects/pi-manager-core
        run: |
          for check in resolver-copies allowlists dependency-declaration agent-rosters; do
            echo "==> $check"
            node test/$check.mjs
          done

  plugin:
    name: C# plugin self-tests
    # Deliberately manual. These need a Unity Editor install and a licence
    # (unity-ci/activate-unity-editor), plus a project with a populated
    # Library/Bee to borrow a reference set from -- none of which belongs in a
    # required check on a pull request.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: compile the plugin against Unity's own assemblies
        run: bash test/compile-plugin.sh

      - run: npm run test:selftests